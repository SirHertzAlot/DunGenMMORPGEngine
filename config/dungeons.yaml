# Dungeon Generation Configuration
# Controls procedural generation of dungeons, constraints, and parameters

generation:
  algorithm: "cellular_automata"  # or "wave_function_collapse", "recursive_backtracking"
  gridSize: 80  # Width/Height of dungeon grid

  # Basic generation parameters
  roomGeneration:
    minSize: 3
    maxSize: 12
    attempts: 100  # How many times to try placing rooms

  # Tile types and distribution
  tileTypes:
    wall: 0
    floor: 1
    door: 2
    stairs: 3
    water: 4
    lava: 5
    treasure: 6

  # Cellular automata parameters
  cellularAutomata:
    fillProbability: 0.45  # % of cells that start as walls
    smoothingIterations: 3
    deathLimit: 4  # Cells with < 4 neighbors become floor
    birthLimit: 4   # Floor cells with >= 4 neighbors become wall

  # Dungeon features
  features:
    bossDoor: true
    treasureRoom: true
    trapRooms: true
    secretDoors: true

  treasureRooms:
    count: 1
    likelihood: 0.8  # 80% chance to have treasure room

  trapDensity: 0.1  # 10% of rooms have traps

  # Enemy placement constraints
  enemies:
    minPerLevel: 3
    maxPerLevel: 10
    averagePerRoom: 1.5

  # Loot generation
  loot:
    minChestsPerLevel: 1
    maxChestsPerLevel: 5
    rarityDistribution:
      common: 0.5
      uncommon: 0.3
      rare: 0.15
      legendary: 0.05

# Dungeon difficulty settings
difficulties:
  easy:
    enemyScaling: 0.8
    lootScaling: 1.0
    trapDensity: 0.05

  normal:
    enemyScaling: 1.0
    lootScaling: 1.0
    trapDensity: 0.1

  hard:
    enemyScaling: 1.3
    lootScaling: 1.2
    trapDensity: 0.2

  legendary:
    enemyScaling: 1.6
    lootScaling: 1.5
    trapDensity: 0.3

# Biome/Theme types (for visual variation)
biomes:
  cave:
    wallTiles: ["stone_wall"]
    floorTiles: ["cave_floor", "rough_stone"]
    enemies: ["skeleton", "giant_spider", "goblin"]
    atmosphere: "dark, damp"

  dungeon:
    wallTiles: ["brick_wall", "dungeon_wall"]
    floorTiles: ["dungeon_floor", "torch_lit"]
    enemies: ["orc", "goblin", "zombie"]
    atmosphere: "oppressive, torchlit"

  tomb:
    wallTiles: ["tomb_wall", "ancient_stone"]
    floorTiles: ["dusty_floor", "sarcophagi"]
    enemies: ["zombie", "skeleton", "mummy"]
    atmosphere: "undead, ancient"

  dragon_lair:
    wallTiles: ["volcanic_wall", "charred_stone"]
    floorTiles: ["lava", "volcanic_floor"]
    enemies: ["dragon", "fire_elemental"]
    atmosphere: "hot, volcanic"

# Level progression - Dungeon difficulty increases with player level
levelProgression:
  level1: 
    difficulty: "easy"
    biome: "cave"
    minEnemyDifficulty: "common"

  level3:
    difficulty: "normal"
    biome: "dungeon"
    minEnemyDifficulty: "uncommon"

  level5:
    difficulty: "hard"
    biome: "tomb"
    minEnemyDifficulty: "uncommon"

  level10:
    difficulty: "legendary"
    biome: "dragon_lair"
    minEnemyDifficulty: "rare"
