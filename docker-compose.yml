x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ── Multi-DC Scylla cluster (NetworkTopologyStrategy) ──────────────────────
  # One host, 4 nodes across two logical DCs so the DC-aware sharding path
  # (DCAwareRoundRobinPolicy + SCYLLA_LOCAL_DC + LocalQuorum) can be exercised
  # locally. us-1 and eu-1 are the seed nodes; every node lists both as seeds.
  # In production each DC would be deployed on its own host/region; the same
  # seeds + SCYLLA_DC/SCYLLA_RACK pattern applies.
  scylla-us-1:
    image: scylladb/scylla:5.1
    container_name: scylla-us-1
    command: ["--cluster-name", "mmo-cluster", "--seeds", "scylla-us-1,scylla-eu-1", "--endpoint-snitch", "GossipingPropertyFileSnitch", "--smp", "1", "--memory", "1G"]
    logging: *default-logging
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - scylla-us-1-data:/var/lib/scylla
      - ./config/scylla/cassandra-rackdc-us.properties:/etc/scylla/cassandra-rackdc.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/$(hostname -i)/9042'"]
      interval: 30s
      timeout: 10s
      retries: 20

  scylla-us-2:
    image: scylladb/scylla:5.1
    container_name: scylla-us-2
    command: ["--cluster-name", "mmo-cluster", "--seeds", "scylla-us-1,scylla-eu-1", "--endpoint-snitch", "GossipingPropertyFileSnitch", "--smp", "1", "--memory", "1G"]
    logging: *default-logging
    volumes:
      - scylla-us-2-data:/var/lib/scylla
      - ./config/scylla/cassandra-rackdc-us.properties:/etc/scylla/cassandra-rackdc.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/$(hostname -i)/9042'"]
      interval: 30s
      timeout: 10s
      retries: 20

  scylla-eu-1:
    image: scylladb/scylla:5.1
    container_name: scylla-eu-1
    command: ["--cluster-name", "mmo-cluster", "--seeds", "scylla-us-1,scylla-eu-1", "--endpoint-snitch", "GossipingPropertyFileSnitch", "--smp", "1", "--memory", "1G"]
    logging: *default-logging
    ports:
      - "127.0.0.1:9043:9042"
    volumes:
      - scylla-eu-1-data:/var/lib/scylla
      - ./config/scylla/cassandra-rackdc-eu.properties:/etc/scylla/cassandra-rackdc.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/$(hostname -i)/9042'"]
      interval: 30s
      timeout: 10s
      retries: 20

  scylla-eu-2:
    image: scylladb/scylla:5.1
    container_name: scylla-eu-2
    command: ["--cluster-name", "mmo-cluster", "--seeds", "scylla-us-1,scylla-eu-1", "--endpoint-snitch", "GossipingPropertyFileSnitch", "--smp", "1", "--memory", "1G"]
    logging: *default-logging
    volumes:
      - scylla-eu-2-data:/var/lib/scylla
      - ./config/scylla/cassandra-rackdc-eu.properties:/etc/scylla/cassandra-rackdc.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/$(hostname -i)/9042'"]
      interval: 30s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7
    container_name: redis
    logging: *default-logging
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Per-region Redis sidecars ──────────────────────────────────────────────
  # The hot cache/buffer is colocated per DC (sidecar + regional cache), so
  # low-latency hot state stays near its region and never hits the cold store.
  redis-us:
    image: redis:7
    container_name: redis-us
    logging: *default-logging
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-us-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-eu:
    image: redis:7
    container_name: redis-eu
    logging: *default-logging
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - redis-eu-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: postgres
    logging: *default-logging
    environment:
      POSTGRES_USER: mmouser
      POSTGRES_PASSWORD: mmopass
      POSTGRES_DB: mmodb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmouser -d mmodb"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mmouser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mmopass}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    logging: *default-logging
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:3000"

  unity-headless:
    image: ${UNITY_HEADLESS_IMAGE:-unityci/editor:ubuntu-lts}
    container_name: unity-headless
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Expose typical game/gRPC ports; adjust as needed
    ports:
      - "127.0.0.1:7777:7777"
      - "127.0.0.1:50051:50051"
    volumes:
      - ../TOR-MMO-ENGINE:/workspace/TOR-MMO-ENGINE:ro
      - unity-headless-data:/home/unity/data
    environment:
      - UNITY_BUILD_PATH=/workspace/TOR-MMO-ENGINE/Build/Server
      - UNITY_LOGLEVEL=Info
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  authoritative:
    build:
      context: ./services/authoritative
    container_name: authoritative
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-mmouser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-mmopass}
      AUTHORITATIVE_DATA_DIR: /app/data
      AUTHORITATIVE_DIAGNOSTIC_HTTP_PREFIXES: http://*:8080/
      AUTHORITATIVE_STACK_ROLE: stable
      AUTHORITATIVE_RELEASE_CHANNEL: stable
      SCYLLA_CONTACT_POINT: scylla-us-1,scylla-eu-1
      SCYLLA_LOCAL_DC: us-east-1
      SCYLLA_REPLICATION: us-east-1:2,eu-west-1:2
      REDIS_HOST: redis-us:6379
    ports:
      - "127.0.0.1:8084:8080"
    volumes:
      - authoritative-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "test -w /app/data"]
      interval: 30s
      timeout: 10s
      retries: 3

  authoritative-canary:
    build:
      context: ./services/authoritative
    container_name: authoritative-canary
    restart: unless-stopped
    profiles: ["canary"]
    logging: *default-logging
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-mmouser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-mmopass}
      AUTHORITATIVE_DATA_DIR: /app/canary-data
      AUTHORITATIVE_DIAGNOSTIC_HTTP_PREFIXES: http://*:8080/
      AUTHORITATIVE_STACK_ROLE: canary
      AUTHORITATIVE_RELEASE_CHANNEL: canary
      SCYLLA_CONTACT_POINT: scylla-us-1,scylla-eu-1
      SCYLLA_LOCAL_DC: eu-west-1
      SCYLLA_REPLICATION: us-east-1:2,eu-west-1:2
      REDIS_HOST: redis-eu:6379
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - authoritative-canary-data:/app/canary-data
    healthcheck:
      test: ["CMD-SHELL", "test -w /app/canary-data"]
      interval: 30s
      timeout: 10s
      retries: 3

  authoritative-router:
    image: nginx:1.27-alpine
    container_name: authoritative-router
    restart: unless-stopped
    profiles: ["canary"]
    logging: *default-logging
    depends_on:
      authoritative:
        condition: service_started
    ports:
      - "127.0.0.1:8086:8080"
    volumes:
      - ./config/nginx/authoritative-canary.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  scylla-us-1-data:
  scylla-us-2-data:
  scylla-eu-1-data:
  scylla-eu-2-data:
  redis-data:
  redis-us-data:
  redis-eu-data:
  pgdata:
  unity-headless-data:
  authoritative-data:
  authoritative-canary-data:
