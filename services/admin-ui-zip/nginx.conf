server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /admin/observability/ {
    proxy_pass http://authoritative-primary/admin/observability/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /admin/agent/ {
    proxy_pass http://authoritative-primary/admin/agent/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Admin-Key "dev-admin-key";
    proxy_read_timeout 120s;
  }

  location /admin/v1/ {
    proxy_pass http://authoritative-primary/admin/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Admin-Key "dev-admin-key";
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
